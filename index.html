<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fbf7f3">
  <title>SYMBLI | Temporarily unavailable</title>
  <style>
    :root{
      --cream:#fbf7f3;
      --navy:#25283a;
      --muted:#77717a;
      --pink:#d88aa0;
      --blush:#f3d7df;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{
      min-height:100vh;
      display:grid;
      place-items:center;
      overflow:hidden;
      background:
        radial-gradient(circle at 16% 12%, rgba(243,215,223,.52), transparent 28rem),
        radial-gradient(circle at 87% 86%, rgba(216,138,160,.16), transparent 28rem),
        var(--cream);
      color:var(--navy);
      font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    main{
      width:min(90vw,620px);
      padding:56px 28px;
      text-align:center;
    }
    .mark{
      width:88px;height:88px;
      margin:0 auto 28px;
      display:grid;place-items:center;
      border:1.5px solid rgba(216,138,160,.62);
      border-radius:50%;
      background:rgba(255,255,255,.42);
      box-shadow:0 14px 40px rgba(37,40,58,.05);
      font-family:Georgia,"Times New Roman",serif;
      font-size:48px;
      line-height:1;
    }
    h1{
      margin:0;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(38px,8vw,62px);
      font-weight:500;
      letter-spacing:.18em;
      text-indent:.18em;
    }
    .rule{
      width:52px;height:2px;
      margin:24px auto;
      border-radius:99px;
      background:linear-gradient(90deg,var(--blush),var(--pink));
    }
    h2{
      margin:0 0 12px;
      font-size:16px;
      font-weight:600;
      letter-spacing:.04em;
    }
    p{
      max-width:440px;
      margin:0 auto;
      color:var(--muted);
      font-size:15px;
      line-height:1.7;
    }
    footer{
      margin-top:42px;
      color:#aaa2a8;
      font-size:11px;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">S</div>
    <h1>SYMBLI</h1>
    <div class="rule"></div>
    <h2>We're currently making some changes.</h2>
    <p>The SYMBLI website is temporarily unavailable.</p>
    <footer>Thank you for your patience</footer>
  </main>
</body>
</html>
