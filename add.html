<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Add your studio — SYMBLI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0a0a0a; --card:#111111; --border:#1f1f1f; --muted:#8a8a8a; --purple:#a855f7; --purple-glow:rgba(168,85,247,.15); }
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:#fff;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1120px;margin:0 auto;padding:32px 20px 80px;display:grid;grid-template-columns:1fr 360px;gap:28px;align-items:start}
  @media(max-width:980px){.wrap{grid-template-columns:1fr}.preview-col{order:-1}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:28px;position:relative;overflow:hidden}
  .wordmark{font-size:11px;letter-spacing:.28em;font-weight:700;opacity:.6}
  .title{font-family:'Instrument Serif',serif;font-size:32px;line-height:.95;font-weight:400;letter-spacing:-.02em;margin:18px 0 8px}
  .subtitle{color:#a3a3a3;font-size:14px;margin-bottom:28px}
  .badge{position:absolute;top:20px;right:20px;display:flex;align-items:center;gap:7px;font-size:11px;padding:6px 10px;border-radius:999px;background:#171717;border:1px solid #242424;letter-spacing:.02em}
  .dot{width:6px;height:6px;border-radius:999px;box-shadow:0 0 0 3px currentColor/15%}
  .live{color:#22c55e}.local{color:#eab308}
  .steps{display:flex;align-items:center;gap:12px;margin:24px 0 28px;padding:12px 14px;background:#0f0f0f;border:1px solid #1a1a1a;border-radius:999px}
  .step{display:flex;align-items:center;gap:8px;font-size:12px;color:#5a5a5a;transition:.2s}
  .step.active{color:#fff}.step.done{color:#a3a3a3}
  .step-num{width:22px;height:22px;border-radius:999px;display:grid;place-items:center;font-size:11px;font-weight:700;border:1px solid #2a2a2a;background:#161616}
  .step.active .step-num{border-color:var(--purple);background:#1c1128;color:#fff;box-shadow:0 0 0 4px var(--purple-glow)}
  .step-line{flex:1;height:1px;background:#1e1e1e}
  .field{margin-bottom:18px}
  .input-wrap{position:relative}
  .input-wrap input,.input-wrap textarea{width:100%;background:#0e0e0e;border:1px solid #232323;border-radius:14px;padding:22px 14px 10px;font-size:15px;color:#fff;outline:none;transition:.2s}
  .input-wrap textarea{resize:none;min-height:92px;padding-top:26px}

  .helper{font-size:11.5px;color:#6e6e6e;margin:7px 2px 0;line-height:1.4}

  .count.warn{color:#eab308}.count.bad{color:#ef4444}

  .check{width:72px;height:72px;border-radius:999px;background:#fff;color:#000;display:grid;place-items:center;margin:0 auto 18px;font-size:32px;animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
  @keyframes pop{0%{transform:scale(.5)}100%{transform:scale(1)}}

<body>
<div class="wrap">
  <div class="card" id="card">
    <div class="badge" id="apiBadge"><span class="dot live" id="apiDot"></span><span id="apiText">Checking sync…</span></div>
    <div class="wordmark">SYMBLI</div>
    <div class="title">Add your studio</div>
    <div class="subtitle">Get discovered by clients near you</div>

    <div class="steps" id="steps">
      <div class="step active" data-s="1"><div class="step-num">1</div> Details</div>
      <div class="step-line"></div>
      <div class="step" data-s="2"><div class="step-num">2</div> Image</div>
      <div class="step-line"></div>
      <div class="step" data-s="3"><div class="step-num">3</div> Publish</div>
    </div>

    <form id="form" novalidate>
      <div class="field">
        <div class="input-wrap">
          <input id="name" type="text" placeholder=" " maxlength="60" required />
          <label for="name">Studio Name *</label>
        </div>
        <div class="helper">Your business name as clients see it</div>
        <div class="err" id="e-name">Studio name is required</div>
      </div>

      <div class="field">
        <div class="input-wrap">
          <input id="location" type="text" placeholder=" " required />
          <label for="location">Location *</label>
        </div>
        <div class="helper">e.g. London, UK or Havant, PO9</div>
        <div class="err" id="e-location">Location is required</div>
      </div>

      <div class="field">
        <div class="input-wrap">
          <input id="booking" type="url" placeholder=" " required />
          <label for="booking">Booking Link *</label>
        </div>
        <div class="helper">Where clients book — Instagram, Fresha, Booksy etc.</div>
        <div class="chips"><span class="chip">IG</span><span class="chip">FRESHA</span><span class="chip">BOOKSY</span><span class="chip">VAGARO</span></div>
        <div class="err" id="e-booking">Valid booking link required (https://...)</div>
      </div>

      <div class="field">
        <div class="input-wrap">
          <input id="instagram" type="text" placeholder=" " />
          <label for="instagram">Instagram (optional)</label>
        </div>
        <div class="helper">Optional — helps verify you · e.g. @glow.havant</div>
      </div>

      <div class="field">
        <div class="input-wrap">
          <textarea id="description" placeholder=" " maxlength="150"></textarea>
          <label for="description">Description</label>
        </div>
        <div class="count" id="charCount">0 / 150</div>
      </div>

      <div class="field">
        <div class="drop" id="drop">
          <div class="drop-icon">◐</div>
          <p><b>Drop cover image</b> or click to browse</p>
          <small>2MB max · Square recommended · JPG, PNG, WebP</small>
          <input id="file" type="file" accept="image/*" hidden />
        </div>
        <div class="thumb" id="thumb" style="display:none">
          <img id="thumbImg" alt="" />
          <button type="button" id="removeImg">✕</button>
        </div>
        <div class="err" id="e-image"></div>
      </div>

      <button class="publish" id="publishBtn" type="submit">Publish studio → Go live</button>
      <div class="helper" style="text-align:center;margin-top:12px">Takes ~3 seconds · No signup needed</div>
    </form>

    <div id="success" class="success" style="display:none">
      <div class="confetti" id="confetti"></div>
      <div class="check">✓</div>
      <div style="font-family:'Instrument Serif',serif;font-size:28px">Live on SYMBLI \uD83C\uDF89</div>
      <div class="subtitle" style="margin-top:8px">Your studio is now discoverable near you</div>
      <div class="btn-row">
        <a class="btn white" id="viewSite" href="https://symbli.co.uk" target="_blank">View on site ↗</a>
        <button class="btn" id="addAnother">Add another</button>
        <a class="btn" href="/dashboard.html">Go to dashboard</a>
      </div>
    </div>
  </div>

  <div class="preview-col">
    <div style="font-size:11px;letter-spacing:.18em;opacity:.5;font-weight:700;margin-bottom:12px">LIVE PREVIEW</div>
    <div class="preview-card">
      <div class="ph" id="ph"><span id="phText">No cover yet</span><img id="phImg" style="display:none" /></div>
      <div class="preview-body">
        <div class="preview-name" id="pvName">Your studio name</div>
        <div class="preview-loc" id="pvLoc">Location · Add yours</div>
        <div class="preview-tag" id="pvTag">NEW · VERIFIED SOON</div>
      </div>
    </div>
    <div style="margin-top:14px;padding:12px 14px;border-radius:14px;background:#111;border:1px solid #1e1e1e;font-size:12px;color:#7a7a7a;line-height:1.5">This is how clients will see you on the SYMBLI homepage. Add a square cover for best results.</div>
  </div>
</div>

<script>
const API_CANDIDATES = ['https://symbli.co.uk','https://symbli.uk'];
let API_BASE = null;
let coverBase64 = '';
const $ = s=>document.querySelector(s);
const badgeDot = $('#apiDot'), badgeText=$('#apiText'), badge=$('#apiBadge');

async function detectApi(){
  for(const base of API_CANDIDATES){
    try{
      const ctrl = new AbortController(); setTimeout(()=>ctrl.abort(),2200);
      const r = await fetch(base+'/api/studios?limit=1', { signal: ctrl.signal });
      if(r.ok || r.status===405 || r.status===400){ API_BASE=base; badgeDot.className='dot live'; badgeText.textContent='Cloud sync: LIVE'; badge.style.borderColor='#1f3a23'; return; }
    }catch(e){}
  }
  badgeDot.className='dot local'; badgeText.textContent='Local only'; badge.style.borderColor='#3a3320';
}
detectApi();

const nameI=$('#name'), locI=$('#location'), bookI=$('#booking'), instaI=$('#instagram'), descI=$('#description');
const pvName=$('#pvName'), pvLoc=$('#pvLoc'), phImg=$('#phImg'), phText=$('#phText'), countEl=$('#charCount');
const drop=$('#drop'), fileI=$('#file'), thumb=$('#thumb'), thumbImg=$('#thumbImg');

function updateSteps(){
  const hasDetails = nameI.value.trim() && locI.value.trim() && bookI.value.trim();
  const hasImage = !!coverBase64;
  document.querySelectorAll('.step').forEach(el=>{
    const s=parseInt(el.dataset.s); el.classList.remove('active','done');
    if($('#success').style.display!=='none'){ if(s===3) el.classList.add('active'); else el.classList.add('done'); }
    else if(s===1){ if(hasDetails && hasImage) el.classList.add('done'); else el.classList.add('active'); }
    else if(s===2){ if(hasImage){ el.classList.add('done'); } else if(hasDetails){ el.classList.add('active'); } }
    else if(s===3 && hasDetails && hasImage){ el.classList.add('active'); }
  });
}
function updatePreview(){
  pvName.textContent = nameI.value.trim() || 'Your studio name';
  pvLoc.textContent = locI.value.trim() || 'Location · Add yours';
  if(coverBase64){ phImg.src=coverBase64; phImg.style.display='block'; phText.style.display='none'; }
  else{ phImg.style.display='none'; phText.style.display='block'; }
  countEl.textContent = descI.value.length+' / 150';
  countEl.className = 'count'+(descI.value.length>130? descI.value.length>=150?' bad':' warn':'');
  updateSteps();
}
['input','change'].forEach(ev=>{ [nameI,locI,bookI,instaI,descI].forEach(i=>i.addEventListener(ev, updatePreview)); });
updatePreview();

function handleFile(f){
  const err=$('#e-image'); err.classList.remove('show');
  if(!f) return;
  if(f.size>2*1024*1024){ err.textContent='Image must be under 2MB'; err.classList.add('show'); return; }
  const r=new FileReader();
  r.onload=()=>{ coverBase64=r.result; thumbImg.src=coverBase64; thumb.style.display='block'; updatePreview(); };
  r.readAsDataURL(f);
}
drop.addEventListener('click',()=>fileI.click());
drop.addEventListener('dragover',e=>{ e.preventDefault(); drop.classList.add('drag'); });
drop.addEventListener('dragleave',()=>drop.classList.remove('drag'));
drop.addEventListener('drop',e=>{ e.preventDefault(); drop.classList.remove('drag'); const f=e.dataTransfer.files[0]; if(f) handleFile(f); });
fileI.addEventListener('change',e=>{ const f=e.target.files[0]; if(f) handleFile(f); });
$('#removeImg').addEventListener('click',()=>{ coverBase64=''; fileI.value=''; thumb.style.display='none'; updatePreview(); });

function validUrl(s){ try{ const u=new URL(s); return u.protocol==='http:'||u.protocol==='https:'; }catch{ return false; } }

$('#form').addEventListener('submit', async e=>{
  e.preventDefault();
  let ok=true;
  const checks=[ ['name', nameI.value.trim()], ['location', locI.value.trim()], ['booking', bookI.value.trim() && validUrl(bookI.value.trim())] ];
  checks.forEach(([id,v])=>{ const el=$('#e-'+id); if(!v){ el.classList.add('show'); ok=false; } else el.classList.remove('show'); });
  if(!ok) return;

  const btn=$('#publishBtn'); const prev=btn.innerHTML; btn.disabled=true; btn.innerHTML='<span style="width:16px;height:16px;border:2px solid #000;border-top-color:transparent;border-radius:999px;display:inline-block;animation:spin .7s linear infinite"></span> Publishing…';
  const style=document.createElement('style'); style.textContent='@keyframes spin{to{transform:rotate(360deg)}}'; document.head.appendChild(style);

  const payload={ name:nameI.value.trim(), location:locI.value.trim(), bookingLink:bookI.value.trim(), instagram:instaI.value.trim(), description:descI.value.trim(), coverImage:coverBase64, createdAt:new Date().toISOString() };

  let success=false;
  if(API_BASE){
    try{
      const r=await fetch(API_BASE+'/api/studios', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
      if(r.ok) success=true; else throw new Error();
    }catch{}
  }
  if(!success){
    try{
      const existing=JSON.parse(localStorage.getItem('symbli_studios')||'[]');
      existing.unshift(payload); localStorage.setItem('symbli_studios', JSON.stringify(existing));
      success=true; badgeDot.className='dot local'; badgeText.textContent='Saved locally';
    }catch{}
  }

  btn.disabled=false; btn.innerHTML=prev; style.remove();
  if(success){
    $('#form').style.display='none'; const s=$('#success'); s.style.display='block'; document.querySelectorAll('.step').forEach(el=>{el.classList.remove('active'); el.classList.add('done');}); document.querySelector('[data-s="3"]').classList.add('active'); document.querySelector('[data-s="3"]').classList.remove('done');
    const conf=$('#confetti'); conf.innerHTML=''; const colors=['#a855f7','#22c55e','#eab308','#fff','#f472b6']; for(let i=0;i<26;i++){ const el=document.createElement('i'); el.style.left=Math.random()*100+'%'; el.style.top='-10px'; el.style.background=colors[Math.floor(Math.random()*colors.length)]; el.style.animationDelay=(Math.random()*.4)+'s'; el.style.transform='rotate('+Math.random()*360+'deg)'; conf.appendChild(el); }
    if(API_BASE) $('#viewSite').href=API_BASE;
    window.scrollTo({top:0,behavior:'smooth'});
  }
});

$('#addAnother').addEventListener('click',()=>{ $('#form').reset(); coverBase64=''; thumb.style.display='none'; $('#form').style.display='block'; $('#success').style.display='none'; updatePreview(); });
<\/script>
</body>
